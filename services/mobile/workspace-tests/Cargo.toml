[package]
name = "zerus-workspace-contract-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[[test]]
name = "workspace_control"
path = "tests/workspace_control.rs"

[dev-dependencies]
zerus-relay = { path = "../relay" }
zerus-mobile-connector = { path = "../connector" }
zerus-mobile-crypto = { path = "../crypto" }
serde_json = "1"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8.6", default-features = false, features = ["any", "sqlite", "postgres", "runtime-tokio-rustls"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"
