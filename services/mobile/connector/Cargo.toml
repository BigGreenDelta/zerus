[package]
name = "zerus-mobile-connector"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Outbound mobile connector for Zerus: relay API v1 client and native hgs bridge"

[[bin]]
name = "zerus-mobile-connector"
path = "src/main.rs"

# Test seams for the black-box suites. Packages never build this feature.
[features]
test-hooks = []

[dependencies]
# Only the protocol library: codec, envelope validation, operation sets and
# limits, without the relay's HTTP server, database or TLS stack.
zerus-relay = { path = "../relay", default-features = false }
zerus-mobile-crypto = { path = "../crypto" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# The journal stays the SQLite file the Python connector writes; bundled like hgs.
rusqlite = { version = "0.32", features = ["bundled"] }
# Effective uid, flock(2) and O_NOFOLLOW through safe calls (no libc on Linux).

# request_hash needs exact number spelling; the codec sorts keys itself.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# File ranges, recordings and sealed credentials, read as Python's strict
# `base64.b64decode(validate=True)` reads them (the relay's version).
base64 = "0.22"
# One current_thread runtime: requests run in claim order, as in Python.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "process", "signal", "sync", "io-util"] }
# Function forms of select and join, so tokio needs no proc-macro crates.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# HTTP/1.1 only, no proxy support and no redirect following (reqwest, the url
# crate and IDNA stay out; README divergence i).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
# rustls with ring and the system roots (SSL_CERT_FILE and SSL_CERT_DIR on
# Linux, the Keychain on macOS); no aws-lc-rs, no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
rustls-native-certs = "0.8"
# SHA-1 for the uuid5 route identities only; ring already backs rustls.
ring = { version = "0.17", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
zerus-windows-private = { path = "../windows-private" }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "1", default-features = false, features = ["macros", "test-util"] }

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
