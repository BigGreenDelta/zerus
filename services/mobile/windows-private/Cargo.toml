[package]
name = "zerus-windows-private"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Private Windows filesystem adapter for the Zerus mobile connector"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
