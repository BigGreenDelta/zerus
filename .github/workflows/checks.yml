name: CI checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to test
        type: string
        default: ''
      run_linux:
        type: boolean
        default: false
      run_arch:
        type: boolean
        default: false
      run_macos:
        type: boolean
        default: false
      run_windows:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    name: Quick checks (source and Rust 1.85)
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      run_linux: ${{ steps.revision.outputs.run_linux }}
      run_arch: ${{ steps.revision.outputs.run_arch }}
      run_macos: ${{ steps.revision.outputs.run_macos }}
      run_windows: ${{ steps.revision.outputs.run_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Record exact test commit and selected coverage
        id: revision
        env:
          RUN_LINUX: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_linux }}
          RUN_ARCH: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_arch }}
          RUN_MACOS: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_macos }}
          RUN_WINDOWS: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_windows }}
        run: |
          commit=$(git rev-parse HEAD)
          {
            echo "commit=$commit"
            echo "run_linux=$RUN_LINUX"
            echo "run_arch=$RUN_ARCH"
            echo "run_macos=$RUN_MACOS"
            echo "run_windows=$RUN_WINDOWS"
          } >> "$GITHUB_OUTPUT"
          printf '### CI coverage\n\nCommit: %s\n\nQuick checks: always\n\nFull Linux CLI: %s\n\nArch desktop/package: %s\n\nmacOS CLI/desktop: %s\n\nWindows client/desktop/portable zip: %s\n' \
            "$commit" "$RUN_LINUX" "$RUN_ARCH" "$RUN_MACOS" "$RUN_WINDOWS" >> "$GITHUB_STEP_SUMMARY"
      - run: python3 scripts/ci/check-source.py
      - name: Release publication contract checks
        run: python3 -m unittest discover -s tests -p 'test_*publication.py'
      - name: Workflow trust boundary checks
        run: python3 -m unittest discover -s tests -p test_ci_security.py
      - name: Validate GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          lint_dir=$(mktemp -d)
          cd "$lint_dir"
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$lint_dir/actionlint" -color -ignore 'unexpected key "cache-mode" for "(workflow|job)" section'

      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-1.85-${{ hashFiles('Cargo.lock') }}
      - run: cargo +1.85.0 test --locked

  relay:
    name: Rust relay (v1, PostgreSQL and connector contracts)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Rust format, lint and local storage contracts
        working-directory: services/mobile/relay
        run: |
          cargo +1.85.0 fmt --check
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked
      - name: Real PostgreSQL cross-worker contract
        working-directory: services/mobile/relay
        env:
          ZERUS_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: cargo +1.85.0 test --locked --test contracts postgres_cross_worker -- --ignored
      - name: Released HTTP and outbound connector compatibility
        run: |
          python3 -m venv "$RUNNER_TEMP/relay-venv"
          "$RUNNER_TEMP/relay-venv/bin/pip" install ./services/mobile
          export ZERUS_RELAY_BINARY="$GITHUB_WORKSPACE/services/mobile/relay/target/debug/zerus-relay"
          export PATH="$GITHUB_WORKSPACE/services/mobile/relay/target/debug:$PATH"
          "$RUNNER_TEMP/relay-venv/bin/python" -m unittest discover -s services/mobile/tests -p test_rust_relay.py -v
          "$RUNNER_TEMP/relay-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test*end_to_end.py' -v
          "$RUNNER_TEMP/relay-venv/bin/python" -m unittest discover -s services/mobile/tests -p test_peer_migration.py -v
      - name: Build the deployment image
        run: docker build --tag zerus-relay-contract services/mobile
      - name: Enforce the 256 MiB runtime envelope
        run: |
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind late-malformed
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode --repeats 2 --concurrency 2
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode --backend postgres

  cli:
    name: CLI (${{ matrix.os }})
    needs: source
    if: needs.source.outputs.run_linux == 'true' || needs.source.outputs.run_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.source.outputs.run_linux == 'true' && needs.source.outputs.run_macos == 'true' && '["ubuntu-24.04","macos-15"]' || needs.source.outputs.run_macos == 'true' && '["macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
      - name: Pinned tmux with verified input-mode support
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci/install-tmux.sh "$RUNNER_TEMP/tmux"
          echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - name: macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install tmux python
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('Cargo.lock') }}
      - name: Keyless official DeepSeek contract fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          echo "$RUNNER_TEMP/dsh/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci/cli.sh
      - name: Keyless native Codex compatibility matrix
        if: runner.os == 'Linux'
        run: python3 scripts/ci/agent-compatibility.py
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-results-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  arch:
    name: Arch desktop and package
    needs: source
    if: needs.source.outputs.run_arch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Arch dependencies and unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake ninja qt6-base qt6-webengine qt6-svg kstatusnotifieritem kwindowsystem kidletime tmux openssh python ccache dbus namcap desktop-file-utils
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/user/.cargo/registry
            /home/user/.cargo/git
            /home/user/.cache/ccache
          key: arch-${{ hashFiles('Cargo.lock', 'tray/CMakeLists.txt') }}
      - name: Test desktop and build package
        run: |
          chown -R user:user /home/user
          runuser -u user -- env QTWEBENGINE_DISABLE_SANDBOX=1 bash scripts/ci/arch.sh
      - name: Verify installed system bundle in disposable home
        shell: bash
        run: |
          set -euo pipefail
          pacman -U --noconfirm artifacts/*.pkg.tar.zst
          runuser -u user -- python3 scripts/check-installed-package.py 2>&1 | tee artifacts/test-results/installed-package.log
      - name: Retain Arch package and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-x86_64-${{ needs.source.outputs.commit }}
          path: artifacts
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  mac-desktop:
    name: macOS desktop
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: brew install cmake qt qtwebengine ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: mac-desktop-${{ runner.arch }}-${{ hashFiles('tray/CMakeLists.txt') }}
      - run: bash scripts/ci/gui.sh
      - name: Retain desktop test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-desktop-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  windows-desktop:
    name: Windows client, desktop and portable zip
    needs: source
    if: needs.source.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Line tables keep test backtraces readable and bound the cached target size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      ZERUS_BUILD_JOBS: 4
    steps:
      # Before checkout: the runner's Git converts text files to CRLF by default,
      # which changes fixtures, scripts and embedded text.
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      # One exact interpreter for every Python step; the runner image's default
      # changes with the image.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup toolchain install 1.85.0 --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-stable-${{ hashFiles('Cargo.lock') }}
      # The runner gives every step a synchronous pipe as stdin. Windows OpenSSH
      # (and the fake client, which refuses it) must never inherit it, so steps
      # that start hgs, ssh or the desktop app read from /dev/null.
      - name: Rust client tests, Rust 1.85 lints and release build
        run: |
          mkdir -p artifacts/test-results
          cargo test --locked </dev/null 2>&1 | tee artifacts/test-results/rust.log
          # Pinned like the relay lints, so a new stable release cannot fail an
          # unchanged commit. Windows-only code is compiled nowhere else, so this
          # also checks it against Rust 1.85.
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings 2>&1 | tee artifacts/test-results/clippy.log
          cargo build --release --locked
          cargo build --locked --example fake_ssh
      - name: Windows client integration tests
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_FAKE_SSH=$(cygpath -w "$PWD/target/debug/examples/fake_ssh.exe")
          export HGS_TEST_BIN HGS_TEST_FAKE_SSH
          python -m unittest discover -s tests -p test_windows_client.py -v </dev/null 2>&1 | tee artifacts/test-results/windows-client.log
      # The cache follows the caller's token: PR and manual runs restore it but
      # cannot save it. The key covers the Qt release, modules and installer lock.
      - name: Restore Qt 6.10.3 for MSVC with WebEngine
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: windows-qt-6.10.3-win64_msvc2022_64-qtwebengine-qtwebchannel-qtpositioning-${{ hashFiles('scripts/ci/aqt-requirements.txt') }}
      # aqtinstall 3.3.0 cannot resolve the split repository layout of Qt 6.11+
      # for Windows yet. It and its dependencies come only from the hash-locked
      # wheels, in an environment of their own that later steps never use.
      - name: Install Qt 6.10.3 with the hash-locked aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/aqt"
          aqt_python=$(cygpath -u "$RUNNER_TEMP/aqt/Scripts/python.exe")
          "$aqt_python" -m pip install --no-input --disable-pip-version-check --require-hashes --only-binary :all: \
            -r scripts/ci/aqt-requirements.txt </dev/null
          "$aqt_python" -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 \
            -m qtwebengine qtwebchannel qtpositioning --outputdir "$RUNNER_TEMP/Qt" </dev/null
          rm -rf "$(cygpath -u "$RUNNER_TEMP/aqt")"
      - name: Use Qt 6.10.3
        run: |
          qt=$(cygpath -w "$RUNNER_TEMP/Qt/6.10.3/msvc2022_64")
          test -f "$(cygpath -u "$qt")/bin/windeployqt.exe"
          echo "QT_ROOT_DIR=$qt" >> "$GITHUB_ENV"
      - name: Desktop build and offscreen Qt suites
        run: bash scripts/ci/gui.sh </dev/null
      - name: Portable zip from the tested executables
        run: |
          python scripts/package-windows.py --cli target/release/hgs.exe --gui .ci-build/gui/hgs-tray.exe \
            --output artifacts/zerus-windows-x86_64.zip </dev/null 2>&1 | tee artifacts/test-results/package.log
          python scripts/check-windows-portable.py artifacts/zerus-windows-x86_64.zip --run --selftest \
            </dev/null 2>&1 | tee artifacts/test-results/portable.log
      # Nightly assembly downloads this artifact from the same run.
      - name: Retain Windows portable zip and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64-${{ needs.source.outputs.commit }}
          path: artifacts
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}
          compression-level: 0

  gate:
    name: Suite results
    if: always() && (github.event.repository.private == false || github.event_name == 'workflow_dispatch')
    needs: [source, relay, cli, arch, mac-desktop, windows-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      RUN_CLI: ${{ needs.source.outputs.run_linux == 'true' || needs.source.outputs.run_macos == 'true' }}
      RUN_ARCH: ${{ needs.source.outputs.run_arch == 'true' }}
      RUN_MACOS: ${{ needs.source.outputs.run_macos == 'true' }}
      RUN_WINDOWS: ${{ needs.source.outputs.run_windows == 'true' }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          selected = {
              'source': True,
              'relay': True,
              'cli': json.loads(os.environ['RUN_CLI']),
              'arch': json.loads(os.environ['RUN_ARCH']),
              'mac-desktop': json.loads(os.environ['RUN_MACOS']),
              'windows-desktop': json.loads(os.environ['RUN_WINDOWS']),
          }
          for name, enabled in selected.items():
              expected = 'success' if enabled else 'skipped'
              actual = results[name]['result']
              if actual != expected:
                  raise SystemExit(f"{name}: {actual}, expected {expected}")
          print('All selected CI suites passed; unselected suites were skipped.')
          PY
