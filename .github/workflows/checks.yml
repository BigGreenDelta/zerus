name: CI checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to test
        type: string
        default: ''
      run_linux:
        type: boolean
        default: false
      run_arch:
        type: boolean
        default: false
      run_macos:
        type: boolean
        default: false
      run_windows:
        type: boolean
        default: false
      # Only the trusted main checks in ci.yml, whose token can write caches,
      # pass true. Every other caller restores caches and never saves them.
      save_caches:
        description: Save refreshed build caches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    name: Resolve commit
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      run_linux: ${{ steps.revision.outputs.run_linux }}
      run_arch: ${{ steps.revision.outputs.run_arch }}
      run_macos: ${{ steps.revision.outputs.run_macos }}
      run_windows: ${{ steps.revision.outputs.run_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Record exact test commit and selected coverage
        id: revision
        env:
          RUN_LINUX: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_linux }}
          RUN_ARCH: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_arch }}
          RUN_MACOS: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_macos }}
          RUN_WINDOWS: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_windows }}
        run: |
          commit=$(git rev-parse HEAD)
          {
            echo "commit=$commit"
            echo "run_linux=$RUN_LINUX"
            echo "run_arch=$RUN_ARCH"
            echo "run_macos=$RUN_MACOS"
            echo "run_windows=$RUN_WINDOWS"
          } >> "$GITHUB_OUTPUT"
          printf '### CI coverage\n\nCommit: %s\n\nQuick checks, Android unit tests and lint: always\n\nFull Linux CLI: %s\n\nArch desktop/package: %s\n\nmacOS CLI/desktop and iOS: %s\n\nWindows client/desktop/portable zip and real agents: %s\n' \
            "$commit" "$RUN_LINUX" "$RUN_ARCH" "$RUN_MACOS" "$RUN_WINDOWS" >> "$GITHUB_STEP_SUMMARY"

  quick:
    name: Quick checks (source and Rust 1.99)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/ci/check-source.py
      - name: Release publication contract checks
        run: python3 -m unittest discover -s tests -p 'test_*publication.py'
      - name: Workflow trust boundary checks
        run: python3 -m unittest discover -s tests -p test_ci_security.py
      - name: Scan the tree and all history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          cd "$scan_dir"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          # Negative control: a token generated here, committed and then deleted,
          # must fail the same history scan, so a silenced scanner cannot pass.
          mkdir control
          git -C control init -q
          python3 -c 'import secrets, string; print("token = \"ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)) + "\"  # gitleaks:allow")' > control/leak.py
          git -C control add leak.py
          git -C control -c user.name=ci -c user.email=ci@example.invalid commit -qm add
          git -C control rm -q leak.py
          git -C control -c user.name=ci -c user.email=ci@example.invalid commit -qm remove
          status=0
          "$scan_dir/gitleaks" git --no-banner --redact --ignore-gitleaks-allow --exit-code 3 control || status=$?
          if [ "$status" != 3 ]; then
            echo "::error::Gitleaks did not report the generated control token (exit $status)."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          "$scan_dir/gitleaks" git --no-banner --redact --ignore-gitleaks-allow --exit-code 1 .
          "$scan_dir/gitleaks" dir --no-banner --redact --ignore-gitleaks-allow --exit-code 1 .
      - name: Validate GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          lint_dir=$(mktemp -d)
          cd "$lint_dir"
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$lint_dir/actionlint" -color -ignore 'unexpected key "cache-mode" for "(workflow|job)" section'

      - run: rustup toolchain install 1.99.1 --profile minimal
      # Rust caches: the compiler identity and a monthly epoch precede the lock
      # hash. A Cargo.lock change restores the previous target; a new month or
      # compiler starts afresh, so stale dependency builds cannot accumulate.
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust 1.99 cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - run: cargo +1.99.1 test --locked
      - name: Save Rust 1.99 cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  relay:
    name: Rust relay (v1, PostgreSQL and connector contracts)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # The Rust contracts and relay fixtures create and drop their own databases.
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # Each storage contract and relay fixture creates and drops its own
      # database on the service. With the requirement set, a missing URL fails
      # instead of falling back to SQLite or skipping.
      - name: Rust format, lint and PostgreSQL storage contracts
        working-directory: services/mobile/relay
        env:
          ZERUS_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          ZERUS_REQUIRE_RELAY_E2E: "1"
        run: |
          cargo +1.99.1 fmt --check
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 test --locked
          cargo +1.99.1 test --locked --test contracts postgres_cross_worker -- --ignored
          # The connector links only the protocol library: it builds without the
          # server stack, reproduces the golden vectors, and no build may give
          # serde_json insertion-ordered maps.
          cargo +1.99.1 clippy --locked --no-default-features --lib --test codec --test vectors -- -D warnings
          cargo +1.99.1 build --locked --no-default-features --lib
          cargo +1.99.1 test --locked --no-default-features --test codec --test vectors
          library="$(cargo +1.99.1 tree --locked --no-default-features --target all -e normal --prefix none)"
          if grep -E '^(axum|clap|hyper|reqwest|ring|rustls|sqlx|tokio|tower)[ -]' <<<"$library"; then
            echo "The protocol library depends on server crates" >&2
            exit 1
          fi
          serde_features() {
            features="$(cargo +1.99.1 tree --locked --target all -e features -i serde_json "$@")"
            if ! grep -q 'serde_json feature "arbitrary_precision"' <<<"$features" \
              || grep -q 'serde_json feature "preserve_order"' <<<"$features"; then
              echo "serde_json needs arbitrary_precision and must not preserve_order $*" >&2
              exit 1
            fi
          }
          serde_features
          serde_features --no-default-features
      # Every services/mobile/tests module runs once, and relay fixtures run the
      # Rust process on their own PostgreSQL databases. The speech suites also
      # run against the retained Python reference relay. The black-box connector
      # suites (test_bb_*) run in the connector job; the end-to-end suites run
      # here against both connectors, the Rust one built beside the relay.
      - name: Released HTTP and outbound connector compatibility
        env:
          ZERUS_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          ZERUS_REQUIRE_RELAY_E2E: "1"
        run: |
          cargo +1.99.1 build --locked --bin hgs
          cargo +1.99.1 build --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir services/mobile/relay/target
          export ZERUS_CONNECTOR_E2E_COMMAND="$GITHUB_WORKSPACE/services/mobile/relay/target/debug/zerus-mobile-connector"
          python3 -m venv "$RUNNER_TEMP/relay-venv"
          "$RUNNER_TEMP/relay-venv/bin/pip" install ./services/mobile -r services/mobile/tests/requirements.txt
          export ZERUS_RELAY_BINARY="$GITHUB_WORKSPACE/services/mobile/relay/target/debug/zerus-relay"
          export ZERUS_DIRECTORY_TEST_HGS="$GITHUB_WORKSPACE/target/debug/hgs"
          export PATH="$GITHUB_WORKSPACE/services/mobile/relay/target/debug:$PATH"
          "$RUNNER_TEMP/relay-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_[!b]*.py' -v
          env -u ZERUS_RELAY_BINARY "$RUNNER_TEMP/relay-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_mobile_speech*.py' -v
      - name: Build the deployment image
        run: docker build --tag zerus-relay-contract services/mobile
      - name: Enforce the 256 MiB runtime envelope
        run: |
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind late-malformed
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode --repeats 2 --concurrency 2
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode --backend postgres

  # The Rust connector against the golden vectors, the Python connector and hgs
  # on one journal, and the black-box suites against both implementations.
  connector:
    name: Rust mobile connector (Rust 1.99 and black-box suites)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The cache keeps dependency builds; incremental state of this crate
      # changes with every commit and would only enlarge it.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore connector Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/mobile/connector/target
          key: connector-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('services/mobile/connector/Cargo.lock') }}
          restore-keys: connector-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Format, lint and dependency boundaries
        working-directory: services/mobile/connector
        run: |
          cargo +1.99.1 fmt --check
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 clippy --locked --all-targets --features test-hooks -- -D warnings
          cargo +1.99.1 build --locked --features test-hooks
          cargo +1.99.1 build --locked
          # The black-box test seams exist only with the test-hooks feature.
          if grep -q ZERUS_CONNECTOR_TEST_ target/debug/zerus-mobile-connector; then
            echo "A build without test-hooks reads ZERUS_CONNECTOR_TEST_ variables" >&2
            exit 1
          fi
          # No server, database, TLS-library or proxy-aware HTTP stack in the lock.
          if grep -E '^name = "(axum|sqlx|reqwest|openssl-sys|native-tls)"$' Cargo.lock; then
            echo "The connector lock holds a forbidden crate" >&2
            exit 1
          fi
          # request_hash needs exact numbers, and no build may give serde_json
          # insertion-ordered maps.
          features="$(cargo +1.99.1 tree --locked --target all -e features -i serde_json)"
          if ! grep -q 'serde_json feature "arbitrary_precision"' <<<"$features" \
            || grep -q 'serde_json feature "preserve_order"' <<<"$features"; then
            echo "serde_json needs arbitrary_precision and must not preserve_order" >&2
            exit 1
          fi
      - name: Python connector and hgs for the handoff tests
        run: |
          cargo +1.99.1 build --locked --bin hgs
          python3 -m venv "$RUNNER_TEMP/connector-venv"
          "$RUNNER_TEMP/connector-venv/bin/pip" install ./services/mobile
      - name: Vector, binary and handoff tests
        working-directory: services/mobile/connector
        env:
          ZERUS_CONNECTOR_TEST_PYTHON: ${{ runner.temp }}/connector-venv/bin/python
          ZERUS_CONNECTOR_TEST_HGS: ${{ github.workspace }}/target/debug/hgs
        run: cargo +1.99.1 test --locked
      - name: Save connector Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/mobile/connector/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      # One venv per commit recorded as a rollback baseline, for the journal
      # handoff tests (test_bb_handoff.py); none is recorded before a cutover.
      - name: Rollback baseline Python connectors
        run: |
          commands=""
          for commit in $(python3 -c 'import json, sys; print(*(b["commit"] for b in json.load(open(sys.argv[1]))["baselines"]))' \
              services/mobile/tests/rollback-baselines.json); do
            git fetch --no-tags --depth 1 origin "$commit"
            mkdir "$RUNNER_TEMP/baseline-$commit"
            git archive "$commit" services/mobile | tar -x -C "$RUNNER_TEMP/baseline-$commit"
            python3 -m venv "$RUNNER_TEMP/rollback-$commit"
            "$RUNNER_TEMP/rollback-$commit/bin/pip" install "$RUNNER_TEMP/baseline-$commit/services/mobile"
            commands="$commands${commands:+:}$RUNNER_TEMP/rollback-$commit/bin/zerus-mobile-connector"
          done
          echo "ZERUS_CONNECTOR_ROLLBACK_COMMANDS=$commands" >> "$GITHUB_ENV"
      # The Python run covers every module; the Rust run only those in ported.json,
      # against a build with the test-hooks seams (cargo test rebuilt it without).
      # Both write differential traces, compared at the end, and they run beside
      # the soak of the Rust build: the connectors' own clocks set their pace.
      - name: Black-box suites against the Python and Rust connectors, differential traces and soak
        run: |
          (cd services/mobile/connector && cargo +1.99.1 build --locked --features test-hooks)
          rust="$GITHUB_WORKSPACE/services/mobile/connector/target/debug/zerus-mobile-connector"
          traces="$RUNNER_TEMP/traces"
          ZERUS_CONNECTOR_TRACE_DIR="$traces/python" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_bb_*.py' -v \
            > "$RUNNER_TEMP/python.log" 2>&1 &
          python=$!
          ZERUS_CONNECTOR_TRACE_DIR="$traces/rust" ZERUS_CONNECTOR_COMMAND="$rust" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_bb_*.py' -v \
            > "$RUNNER_TEMP/rust.log" 2>&1 &
          rust_suites=$!
          ZERUS_CONNECTOR_SOAK_SECONDS=300 ZERUS_CONNECTOR_COMMAND="$rust" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest discover -s services/mobile/tests -p test_bb_soak.py -v \
            > "$RUNNER_TEMP/soak.log" 2>&1 &
          soak=$!
          status=0
          finish() {
            if wait "$2"; then
              echo "::group::$1"; cat "$RUNNER_TEMP/$1.log"; echo "::endgroup::"
            else
              echo "::error::$1 black-box run failed"; cat "$RUNNER_TEMP/$1.log"; status=1
            fi
          }
          finish python "$python"
          finish rust "$rust_suites"
          finish soak "$soak"
          "$RUNNER_TEMP/connector-venv/bin/python" services/mobile/tests/differential.py compare \
            "$traces/python" "$traces/rust" || status=1
          exit "$status"

  # The connector on macOS (design C7): a cold Rust 1.99 build, its unit,
  # vector and binary tests, and the black-box modules that need no real hgs
  # against the build with the test seams, with Keychain trust and kqueue. The
  # journal handoffs run this tree's Python connector beside it.
  connector-macos:
    name: Rust mobile connector on macOS (smoke)
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Python connector for the handoffs
        run: |
          python3 -m venv "$RUNNER_TEMP/connector-venv"
          "$RUNNER_TEMP/connector-venv/bin/pip" install ./services/mobile
      - name: Unit, vector and binary tests
        working-directory: services/mobile/connector
        run: |
          cargo +1.99.1 test --locked --lib --test config_vectors --test journal_vectors --test runtime_vectors \
            --test mutations --test launch_runtime --test binary
      - name: Black-box smoke against the Rust connector
        working-directory: services/mobile/tests
        run: |
          (cd ../connector && cargo +1.99.1 build --locked --features test-hooks)
          ZERUS_CONNECTOR_COMMAND="$GITHUB_WORKSPACE/services/mobile/connector/target/debug/zerus-mobile-connector" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest -v test_bb_harness test_bb_startup test_bb_journal \
            test_bb_requests test_bb_restart test_bb_retention test_bb_heartbeat test_bb_runtime test_bb_send \
            test_bb_signals test_bb_handoff

  # The iOS client with the other macOS suites: ZerusKit unit tests on the host and
  # an unsigned simulator build of the app. No signing identity reaches this job.
  ios:
    name: iOS core tests and simulator build
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Select Xcode 26 or later
        run: bash mobile/ios/scripts/select-xcode.sh
      - name: ZerusKit tests
        working-directory: mobile/ios/ZerusKit
        run: swift test
      - name: Simulator build
        run: |
          xcodebuild -project mobile/ios/Zerus.xcodeproj -scheme Zerus -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO ZERUS_SOURCE_REVISION="${SOURCE_COMMIT:0:12}" build

  # Every run, PRs included, tests and lints the Firebase variant that the signed
  # Dev build ships. A synthetic configuration with placeholder values stands in
  # for the private one; no signer or Firebase project reaches this job.
  android:
    name: Android unit tests and lint
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: JDK 17 and synthetic Firebase configuration
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          cat > mobile/android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "zerus-ci-example"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                              "android_client_info": {"package_name": "app.zerus.mobile"}},
              "api_key": [{"current_key": "synthetic-placeholder"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      # Gradle caches: a monthly epoch precedes the hash of the wrapper and build
      # scripts. A dependency change restores the previous entry; a new month
      # starts afresh, so unused artifacts cannot accumulate.
      - name: Gradle cache identity
        id: gradle
        run: echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-v1-${{ steps.gradle.outputs.epoch }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/**/*.gradle.kts') }}
          restore-keys: android-gradle-v1-${{ steps.gradle.outputs.epoch }}-
      - name: Unit tests and release lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease -PzerusFirebase=true
      # Third-party notices must list exactly what the published Firebase release
      # build resolves, with the notices inside its resolved artifacts.
      - name: Android library notices match the release classpath
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon -q --init-script ../../scripts/android-resolved-artifacts.gradle -PzerusFirebase=true :app:zerusResolvedNotices
          python3 -I ../../scripts/android-notices.py --check
      - name: Save Gradle cache
        if: inputs.save_caches && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Collect Android reports
        if: failure()
        run: |
          mkdir -p artifacts/test-results
          cp -R mobile/android/app/build/reports artifacts/test-results/android || true
          mkdir -p artifacts/test-results/camera-video-fixed
          cp -R mobile/android/camera-video-fixed/build/reports artifacts/test-results/camera-video-fixed/reports || true
          cp -R mobile/android/camera-video-fixed/build/test-results artifacts/test-results/camera-video-fixed/test-results || true
      - name: Retain Android reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  cli:
    name: CLI (${{ matrix.os }})
    needs: source
    if: needs.source.outputs.run_linux == 'true' || needs.source.outputs.run_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.source.outputs.run_linux == 'true' && needs.source.outputs.run_macos == 'true' && '["ubuntu-24.04","macos-15"]' || needs.source.outputs.run_macos == 'true' && '["macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Python integration jobs mostly wait on terminals and subprocesses: twice
      # the 4 (Linux) or 3 (macOS) runner vCPUs.
      ZERUS_PYTHON_JOBS: ${{ matrix.os == 'macos-15' && 6 || 8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
      - name: Pinned tmux with verified input-mode support
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci/install-tmux.sh "$RUNNER_TEMP/tmux"
          echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - name: macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install tmux python
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Keyless official DeepSeek contract fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          echo "$RUNNER_TEMP/dsh/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci/cli.sh
      - name: Save Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Keyless native Codex, Claude Code and OpenCode compatibility matrix
        run: python3 scripts/ci/agent-compatibility.py
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-results-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  # Compiler caches use one entry per saving run and restore the newest by
  # prefix. A save follows a successful build that compiled something, keeping
  # only the entries this build used. Cache directories stay outside the
  # workspace, so they never reach packages, the portable zip or artifacts.
  arch:
    name: Arch desktop
    needs: source
    if: needs.source.outputs.run_arch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    env:
      CCACHE_DIR: /home/user/.cache/ccache
      CCACHE_MAXSIZE: 150M
      # Ninja starts a suite's own sources while the libraries it links still build.
      CMAKE_GENERATOR: Ninja
      ZERUS_BUILD_JOBS: 4
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Arch dependencies and unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-tools qt6-webengine qt6-multimedia qt6-svg kstatusnotifieritem kwindowsystem kidletime tmux openssh python ccache dbus
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: arch-ccache-v1-${{ github.run_id }}
          restore-keys: arch-ccache-v1-
      - name: Reset ccache statistics
        id: ccache-start
        run: |
          chown -R user:user /home/user
          runuser -u user -- ccache -z
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Desktop build
        id: build
        run: runuser -u user -- bash scripts/ci/gui.sh build
      - name: ccache statistics
        id: ccache
        if: ${{ !cancelled() }}
        env:
          SAVE: ${{ inputs.save_caches && steps.build.outcome == 'success' }}
          STARTED: ${{ steps.ccache-start.outputs.started }}
        run: |
          runuser -u user -- ccache -sv
          misses=$(runuser -u user -- ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $2 + 0 }')
          if [ "$SAVE" = true ] && [ "${misses:-0}" -gt 0 ]; then
            runuser -u user -- ccache --evict-older-than "$(( $(date +%s) - STARTED + 60 ))s"
            echo save=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        if: inputs.save_caches && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Offscreen Qt suites
        run: runuser -u user -- env QTWEBENGINE_DISABLE_SANDBOX=1 bash scripts/ci/gui.sh test
      - name: Retain desktop test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-desktop-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  arch-package:
    name: Arch package
    needs: source
    if: needs.source.outputs.run_arch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    env:
      ZERUS_DEV_BUILD_NUMBER: ${{ github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEV_UPDATES_ENABLED == 'true' && github.run_number || '' }}
      CCACHE_DIR: /home/user/.cache/ccache
      CCACHE_MAXSIZE: 100M
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      # The makepkg ccache drop-in exists only in this disposable container; the
      # published recipes are unchanged. Its compiler flags differ from the
      # desktop build, so it has a cache family of its own.
      - name: Arch packaging dependencies and unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake ninja qt6-base qt6-tools qt6-webengine qt6-multimedia qt6-svg kstatusnotifieritem kwindowsystem kidletime tmux openssh python ccache namcap desktop-file-utils
          grep -qx 'BUILDENV=(!distcc color !ccache check !sign)' /etc/makepkg.conf ||
            { echo 'The default makepkg BUILDENV changed; review the ccache drop-in.' >&2; exit 1; }
          echo 'BUILDENV=(!distcc color ccache check !sign)' > /etc/makepkg.conf.d/ccache.conf
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Cache epoch
        id: epoch
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/user/.cargo/registry
            /home/user/.cargo/git
          key: arch-cargo-v1-${{ steps.epoch.outputs.month }}-${{ hashFiles('Cargo.lock', 'services/mobile/connector/Cargo.lock') }}
          restore-keys: arch-cargo-v1-${{ steps.epoch.outputs.month }}-
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: arch-package-ccache-v1-${{ github.run_id }}
          restore-keys: arch-package-ccache-v1-
      - name: Reset ccache statistics
        id: ccache-start
        run: |
          chown -R user:user /home/user
          runuser -u user -- ccache -z
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build and check package
        id: build
        run: runuser -u user -- bash scripts/build-arch-package.sh
      - name: ccache statistics
        id: ccache
        if: ${{ !cancelled() }}
        env:
          SAVE: ${{ inputs.save_caches && steps.build.outcome == 'success' }}
          STARTED: ${{ steps.ccache-start.outputs.started }}
        run: |
          runuser -u user -- ccache -sv
          misses=$(runuser -u user -- ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $2 + 0 }')
          if [ "$SAVE" = true ] && [ "${misses:-0}" -gt 0 ]; then
            runuser -u user -- ccache --evict-older-than "$(( $(date +%s) - STARTED + 60 ))s"
            echo save=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        if: inputs.save_caches && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Save Cargo registry
        if: inputs.save_caches && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/user/.cargo/registry
            /home/user/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Verify installed system bundle in disposable home
        shell: bash
        run: |
          set -euo pipefail
          pacman -U --noconfirm artifacts/*.pkg.tar.zst
          runuser -u user -- python3 scripts/check-installed-package.py 2>&1 | tee artifacts/test-results/installed-package.log
      # Dev, nightly and release assembly download this artifact from the same run.
      - name: Retain Arch package and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-x86_64-${{ needs.source.outputs.commit }}
          path: artifacts
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  mac-desktop:
    name: macOS desktop
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      CCACHE_MAXSIZE: 100M
      CMAKE_GENERATOR: Ninja
      ZERUS_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: brew install cmake ninja qt qtmultimedia ccache
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: mac-desktop-ccache-v1-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: mac-desktop-ccache-v1-${{ runner.arch }}-
      - name: Reset ccache statistics
        id: ccache-start
        run: |
          ccache -z
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Desktop build
        id: build
        run: bash scripts/ci/gui.sh build
      - name: ccache statistics
        id: ccache
        if: ${{ !cancelled() }}
        env:
          SAVE: ${{ inputs.save_caches && steps.build.outcome == 'success' }}
          STARTED: ${{ steps.ccache-start.outputs.started }}
        run: |
          ccache -sv
          misses=$(ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $2 + 0 }')
          if [ "$SAVE" = true ] && [ "${misses:-0}" -gt 0 ]; then
            ccache --evict-older-than "$(( $(date +%s) - STARTED + 60 ))s"
            echo save=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        if: inputs.save_caches && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Offscreen Qt suites
        run: bash scripts/ci/gui.sh test
      - name: Retain desktop test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-desktop-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  windows-desktop:
    name: Windows client, desktop and portable zip
    needs: source
    if: needs.source.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Line tables keep test backtraces readable and bound the cached target size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      ZERUS_BUILD_JOBS: 4
      # ccache caches MSVC compiles without /Zi, as in Release. Depend mode reads
      # the includes from Ninja's /showIncludes instead of preprocessing again.
      # No base_dir: it would make __FILE__ relative, and suites locate their
      # fixtures from it; the runner's workspace path never changes anyway.
      CCACHE_DEPEND: 1
      CCACHE_MAXSIZE: 500M
    steps:
      # Before checkout: the runner's Git converts text files to CRLF by default,
      # which changes fixtures, scripts and embedded text.
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      # One exact interpreter for every Python step; the runner image's default
      # changes with the image.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      # The runner gives every step a synchronous pipe as stdin. Windows OpenSSH
      # (and the fake client, which refuses it) must never inherit it, so steps
      # that start hgs, ssh or the desktop app read from /dev/null.
      - name: Rust client tests, Rust 1.99 lints and release build
        run: |
          mkdir -p artifacts/test-results
          cargo test --locked </dev/null 2>&1 | tee artifacts/test-results/rust.log
          # Pinned like the relay lints, so a new stable release cannot fail an
          # unchanged commit. Windows-only code is compiled nowhere else, so this
          # also checks it against Rust 1.99.
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings 2>&1 | tee artifacts/test-results/clippy.log
          cargo build --release --locked
          cargo build --locked --example fake_ssh
          cargo build --locked --example fake_agent
      - name: Save Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Windows mobile connector build and native filesystem contracts
        run: |
          cargo +1.99.1 clippy --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir target --lib windows_management::tests </dev/null \
            2>&1 | tee artifacts/test-results/windows-gateway-locks.log
          cargo +1.99.1 test --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir target --test windows_gateway </dev/null \
            2>&1 | tee artifacts/test-results/windows-gateway-config.log
          cargo +1.99.1 test --locked --offline -j2 --manifest-path services/mobile/connector/Cargo.toml --target-dir target -p zerus-windows-private --lib -- --test-threads=2 </dev/null \
            2>&1 | tee artifacts/test-results/windows-gateway-launch-builder.log
          cargo +1.99.1 build --locked --release --manifest-path services/mobile/connector/Cargo.toml --target-dir target
      - name: Windows client integration tests
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_FAKE_SSH=$(cygpath -w "$PWD/target/debug/examples/fake_ssh.exe")
          export HGS_TEST_BIN HGS_TEST_FAKE_SSH
          python -m unittest discover -s tests -p test_windows_client.py -v </dev/null 2>&1 | tee artifacts/test-results/windows-client.log
      # Microsoft's ConPTY pair (spec D6) from the NuGet package pinned in
      # packaging/windows/conpty.json: the package's SHA-256 is checked before it
      # is opened, then each of the two files'. Nothing from it runs here; the
      # host tests and the portable zip below use this folder.
      - name: Pinned ConPTY pair
        run: python scripts/fetch-conpty.py --output "$RUNNER_TEMP/conpty" </dev/null
      # Isolated session hosts of the release build (docs/windows-host-testing.md),
      # also from a copy next to the pinned ConPTY pair, and the terminal backend
      # contract against the host, its default here.
      # The runner puts every step in a job that forbids breakaway, where hgs
      # refuses to start a host (spec D4), so the suites run outside it, started
      # through WMI. Every wait in them has a deadline.
      - name: Windows session host tests
        timeout-minutes: 20
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_FAKE_AGENT=$(cygpath -w "$PWD/target/debug/examples/fake_agent.exe")
          HGS_TEST_FAKE_SSH=$(cygpath -w "$PWD/target/debug/examples/fake_ssh.exe")
          HGS_TEST_CONPTY_DIR=$(cygpath -w "$RUNNER_TEMP/conpty")
          export HGS_TEST_BIN HGS_TEST_FAKE_AGENT HGS_TEST_FAKE_SSH HGS_TEST_CONPTY_DIR
          cd tests
          # Also hosts the suites start from temporary image copies (hgs-host-* folders).
          python ../scripts/ci/outside-job.py --timeout 900 --end "$HGS_TEST_BIN" --end '*\hgs-host-*\hgs.exe' \
            --log ../artifacts/test-results/windows-host.log -- \
            python -m unittest -v test_windows_host test_windows_host_conpty test_windows_host_survival \
            test_windows_lifecycle test_windows_hooks test_backend_contract </dev/null
      # A detached connector has fixture-owned handle custody. Keep this gate
      # outside the legacy host harness's PID/tree and wildcard image cleanup.
      - name: Windows mobile gateway isolated custody gate
        timeout-minutes: 20
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_FAKE_AGENT=$(cygpath -w "$PWD/target/debug/examples/fake_agent.exe")
          HGS_TEST_CONPTY_DIR=$(cygpath -w "$RUNNER_TEMP/conpty")
          HGS_TEST_CONNECTOR=$(cygpath -w "$PWD/target/release/zerus-mobile-connector.exe")
          export HGS_TEST_BIN HGS_TEST_FAKE_AGENT HGS_TEST_CONPTY_DIR HGS_TEST_CONNECTOR
          python scripts/ci/outside-job.py --custody-only --timeout 900 \
            --log artifacts/test-results/windows-mobile-gateway.log -- \
            python -m unittest discover -s tests -p test_windows_mobile_gateway.py -v </dev/null
      # Only trusted main checks save it; PR, manual and candidate runs restore
      # it. The key covers the Qt pin and the installer.
      - name: Restore Qt 6.10.3 for MSVC
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: windows-qt-6.10.3-win64_msvc2022_64-${{ hashFiles('packaging/windows/qt.json', 'scripts/install-qt-windows.py', 'scripts/qt_archives.py') }}
      # The official archives pinned in packaging/windows/qt.json, each checked
      # against its size and SHA-256 and listed before any is extracted, with the
      # runner image's 7-Zip. No Python package is installed for it.
      - name: Install the pinned Qt 6.10.3 for MSVC
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python scripts/install-qt-windows.py --output "$RUNNER_TEMP/Qt" </dev/null
      # A restored installation must also be the pinned one.
      - name: Use Qt 6.10.3
        run: |
          python scripts/install-qt-windows.py --check "$RUNNER_TEMP/Qt" </dev/null
          qt=$(cygpath -w "$RUNNER_TEMP/Qt/6.10.3/msvc2022_64")
          test -f "$(cygpath -u "$qt")/bin/windeployqt.exe"
          echo "QT_ROOT_DIR=$qt" >> "$GITHUB_ENV"
      # The official ccache release, verified like the other downloaded tools
      # (the digest matches its minisign-signed archive). gui.sh adds the
      # compiler launcher when ccache is on PATH.
      - name: Pinned ccache 4.14.1
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSLO https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
          echo '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4  ccache-4.14.1-windows-x86_64.zip' | sha256sum --check --strict
          python -m zipfile -e ccache-4.14.1-windows-x86_64.zip .
          cygpath -w "$PWD/ccache-4.14.1-windows-x86_64" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$(cygpath -w "$RUNNER_TEMP/ccache")" >> "$GITHUB_ENV"
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: windows-ccache-v1-${{ runner.arch }}-qt6.10.3-${{ github.run_id }}
          restore-keys: windows-ccache-v1-${{ runner.arch }}-qt6.10.3-
      - name: Reset ccache statistics
        id: ccache-start
        run: |
          ccache -z
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Desktop build
        id: build
        run: bash scripts/ci/gui.sh build </dev/null
      - name: ccache statistics
        id: ccache
        if: ${{ !cancelled() }}
        env:
          SAVE: ${{ inputs.save_caches && steps.build.outcome == 'success' }}
          STARTED: ${{ steps.ccache-start.outputs.started }}
        run: |
          ccache -sv
          misses=$(ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $2 + 0 }')
          if [ "$SAVE" = true ] && [ "${misses:-0}" -gt 0 ]; then
            ccache --evict-older-than "$(( $(date +%s) - STARTED + 60 ))s"
            echo save=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        if: inputs.save_caches && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      # Saved only after the desktop build has used it, so an incomplete
      # installation never becomes the exact-key entry every later run restores.
      - name: Save Qt 6.10.3
        if: inputs.save_caches && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Offscreen Qt suites
        run: bash scripts/ci/gui.sh test </dev/null
      - name: Portable zip from the tested executables
        run: |
          python scripts/package-windows.py --cli target/release/hgs.exe --gui .ci-build/gui/hgs-tray.exe \
            --connector target/release/zerus-mobile-connector.exe --conpty "$RUNNER_TEMP/conpty" --output artifacts/zerus-windows-x86_64.zip </dev/null 2>&1 | tee artifacts/test-results/package.log
          python scripts/check-windows-portable.py artifacts/zerus-windows-x86_64.zip --run --selftest \
            </dev/null 2>&1 | tee artifacts/test-results/portable.log
      # The per-user installer (packaging/windows/zerus.iss) from that zip, with
      # the runner image's Inno Setup 6: its payload is the zip's files byte for
      # byte. Release assembly takes only the zip at the top of this artifact.
      - name: Per-user installer from the portable zip
        run: |
          python scripts/package-windows-installer.py artifacts/zerus-windows-x86_64.zip \
            --output artifacts/installer/zerus-windows-x86_64-setup.exe </dev/null 2>&1 | tee artifacts/test-results/installer-package.log
      # Install, upgrade over it and uninstall while a session host of the
      # installed build runs from its staged image, outside the step's job as the
      # host suites run.
      - name: Installer upgrade keeps the session host
        timeout-minutes: 15
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_INSTALLER=$(cygpath -w "$PWD/artifacts/installer/zerus-windows-x86_64-setup.exe")
          HGS_TEST_PORTABLE_ZIP=$(cygpath -w "$PWD/artifacts/zerus-windows-x86_64.zip")
          export HGS_TEST_BIN HGS_TEST_INSTALLER HGS_TEST_PORTABLE_ZIP
          cd tests
          python ../scripts/ci/outside-job.py --timeout 600 --end "$HGS_TEST_BIN" --end '*\hgs-host-*\hgs.exe' \
            --log ../artifacts/test-results/installer.log -- \
            python -m unittest -v test_windows_installer_survival </dev/null
      # Stable and nightly assembly download this artifact from the same run.
      - name: Retain Windows portable zip and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64-${{ needs.source.outputs.commit }}
          path: artifacts
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}
          compression-level: 0

  # The reviewed win32-x64 Claude Code and Codex pins of
  # scripts/ci/agent-compatibility.json through isolated session hosts of the
  # release build, each agent against a local fake API. A job of its own, so a
  # failure points at the host and windows-desktop keeps its time margin.
  windows-host:
    name: Windows real agents through the session host
    needs: source
    if: needs.source.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The windows-desktop family, which only that job saves: this job restores
      # it and never saves, so the two jobs cannot race for one key.
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - run: cargo build --release --locked
      - name: Pinned ConPTY pair
        run: python scripts/fetch-conpty.py --output "$RUNNER_TEMP/conpty" </dev/null
      # The runner downloads and verifies each win32-x64 pin, extracts only its
      # executable into a zerus-native-compat-* folder and runs that agent's class
      # of tests/test_windows_native_agents.py; a skipped or empty suite fails.
      # The suites start session hosts, so like the host suites of windows-desktop
      # they run outside the step's job, and their leftovers end by executable
      # path: hosts of the release build, the copies and staged images in the
      # hgs-host-* folders of the suites, and the extracted agents. UTF-8 mode keeps
      # non-ASCII prompts in the logs from failing on a Windows code page.
      - name: Real Claude Code and Codex through the session host
        timeout-minutes: 50
        env:
          PYTHONUTF8: 1
        run: |
          mkdir -p artifacts/test-results
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_CONPTY_DIR=$(cygpath -w "$RUNNER_TEMP/conpty")
          export HGS_TEST_BIN HGS_TEST_CONPTY_DIR
          python scripts/ci/outside-job.py --timeout 2700 --end "$HGS_TEST_BIN" --end '*\hgs-host-*\*.exe' \
            --end '*\zerus-native-compat-*\*.exe' --log artifacts/test-results/windows-real-agents.log -- \
            python scripts/ci/agent-compatibility.py </dev/null
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-host-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  gate:
    name: Suite results
    if: always() && (github.event.repository.private == false || github.event_name == 'workflow_dispatch')
    needs: [source, quick, relay, connector, connector-macos, ios, android, cli, arch, arch-package, mac-desktop, windows-desktop, windows-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      RUN_CLI: ${{ needs.source.outputs.run_linux == 'true' || needs.source.outputs.run_macos == 'true' }}
      RUN_ARCH: ${{ needs.source.outputs.run_arch == 'true' }}
      RUN_MACOS: ${{ needs.source.outputs.run_macos == 'true' }}
      RUN_WINDOWS: ${{ needs.source.outputs.run_windows == 'true' }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          selected = {
              'source': True,
              'quick': True,
              'relay': True,
              'connector': True,
              'android': True,
              'cli': json.loads(os.environ['RUN_CLI']),
              'arch': json.loads(os.environ['RUN_ARCH']),
              'arch-package': json.loads(os.environ['RUN_ARCH']),
              'mac-desktop': json.loads(os.environ['RUN_MACOS']),
              'connector-macos': json.loads(os.environ['RUN_MACOS']),
              'ios': json.loads(os.environ['RUN_MACOS']),
              'windows-desktop': json.loads(os.environ['RUN_WINDOWS']),
              'windows-host': json.loads(os.environ['RUN_WINDOWS']),
          }
          for name, enabled in selected.items():
              expected = 'success' if enabled else 'skipped'
              actual = results[name]['result']
              if actual != expected:
                  raise SystemExit(f"{name}: {actual}, expected {expected}")
          print('All selected CI suites passed; unselected suites were skipped.')
          PY
