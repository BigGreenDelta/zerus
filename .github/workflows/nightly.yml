name: Nightly
run-name: Nightly main (${{ github.run_number }})

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      run_linux: true
      run_arch: true
      run_macos: true
  assemble:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-x86_64-${{ github.sha }}
          path: artifacts/arch
      - name: Arch packaging dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python qt6-base qt6-webengine qt6-svg kstatusnotifieritem kwindowsystem kidletime tmux openssh curl procps-ng hicolor-icon-theme namcap desktop-file-utils
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Assemble and check exact verified nightly
        env:
          NIGHTLY_RUN_ID: ${{ github.run_id }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          packages=(artifacts/arch/*.pkg.tar.zst)
          test "${#packages[@]}" = 1
          runuser -u user -- python3 scripts/prepare-nightly.py --package "${packages[0]}" \
            --run-id "$NIGHTLY_RUN_ID" --run-number "$NIGHTLY_RUN_NUMBER" --output dist
          runuser -u user -- bash scripts/check-nightly-package.sh dist
          pacman -U --noconfirm dist/*.pkg.tar.zst
          runuser -u user -- python3 scripts/check-installed-package.py
      - name: Retain nightly packaging logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-packaging-${{ github.run_id }}
          path: artifacts/test-results
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerus-nightly-${{ github.run_id }}-candidate
          path: dist
          retention-days: 3
          include-hidden-files: true
