name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version matching VERSION (without v)
        required: true
        type: string
      create_draft:
        description: Create a GitHub draft release after all checks pass
        type: boolean
        default: false
      run_macos:
        description: Also run macOS CLI and desktop checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check requested release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['REQUESTED_VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a stable semantic version.'
          assert version == pathlib.Path('VERSION').read_text().strip(), 'Update VERSION first.'
          PY
  verify:
    needs: version
    cache-mode: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
      run_linux: true
      run_arch: true
      run_macos: ${{ inputs.run_macos }}
  assemble:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-x86_64-${{ github.sha }}
          path: artifacts/arch
      - name: Arch release dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake ninja qt6-base qt6-webengine qt6-multimedia qt6-svg kstatusnotifieritem kwindowsystem kidletime tmux openssh python namcap desktop-file-utils
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Assemble exact verified candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          packages=(artifacts/arch/*.pkg.tar.zst)
          test "${#packages[@]}" = 1
          runuser -u user -- python3 scripts/prepare-release.py --version "$RELEASE_VERSION" --package "${packages[0]}" --output dist
          runuser -u user -- bash scripts/check-release-packages.sh dist
      - name: Retain release packaging logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packaging-${{ github.sha }}
          path: artifacts/test-results/*
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerus-${{ inputs.version }}-candidate
          path: dist
          retention-days: 14
          include-hidden-files: true # .SRCINFO is required AUR metadata.
  draft:
    if: inputs.create_draft
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zerus-${{ inputs.version }}-candidate
          path: dist
      - name: Create reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" --draft --target "$RELEASE_COMMIT" \
            --title "Zerus $RELEASE_VERSION" \
            --notes "Arch Linux x86_64 release candidate. Verify the artifacts and publication checklist before publishing." \
            dist/*.tar.gz dist/*.pkg.tar.zst dist/SHA256SUMS dist/release-info.json
