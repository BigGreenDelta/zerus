name: CI
run-name: CI ${{ inputs.ref || github.ref_name }} (${{ github.event_name }})

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or refs/pull/NUMBER/head to test (blank uses selected workflow branch)
        type: string
        default: ''
      run_linux:
        description: Run full Linux CLI integration tests and release build
        type: boolean
        default: true
      run_arch:
        description: Build/test Arch desktop and pacman package
        type: boolean
        default: true
      run_macos:
        description: Run macOS CLI and desktop builds/tests
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to test
        type: string
        default: ''
      run_linux:
        type: boolean
        default: false
      run_arch:
        type: boolean
        default: false
      run_macos:
        type: boolean
        default: false

permissions:
  contents: read

# Fixed modes are enforced by scoped cache tokens, including checked-out code.
cache-mode: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  automatic:
    name: Trusted main checks
    if: >-
      github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') && (!inputs.ref || inputs.ref == github.sha)
    cache-mode: write
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      run_linux: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_linux }}
      run_arch: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_arch }}
      run_macos: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_macos }}
  review:
    name: PR and manual checks
    if: >-
      !(github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') && (!inputs.ref || inputs.ref == github.sha))
    cache-mode: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      run_linux: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_linux }}
      run_arch: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_arch }}
      run_macos: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_macos }}
  gate:
    name: CI gate
    if: always() && (github.event.repository.private == false || github.event_name == 'workflow_dispatch')
    needs: [automatic, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          conclusions = sorted(job['result'] for job in results.values())
          if conclusions != ['skipped', 'success']:
              raise SystemExit(f'Exactly one selected check workflow must succeed: {conclusions}')
          PY
  dev:
    name: Verified main dev candidates
    needs: [gate, automatic]
    if: github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false && vars.DEV_UPDATES_ENABLED == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/dev.yml
