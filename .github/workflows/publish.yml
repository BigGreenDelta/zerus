name: Publish release
run-name: Publish Zerus ${{ inputs.version }} from candidate run ${{ inputs.candidate_run }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed candidate version (without v)
        required: true
        type: string
      candidate_run:
        description: Successful Release candidate run ID from main; reuse the same run on retries
        required: true
        type: string

permissions:
  contents: read

cache-mode: none

concurrency:
  group: release-publication # Serialize all versions sharing the AUR repositories.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require upstream main
        env:
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          test "$WORKFLOW_REPOSITORY" = ufna/zerus
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run local publication contract checks
        run: python3 -m unittest discover -s tests -p test_release_publication.py
      - name: Download and verify reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          python3 scripts/fetch-release-candidate.py --version "$RELEASE_VERSION" \
            --run-id "$CANDIDATE_RUN" --output dist
      - name: Prepare dedicated AUR identity
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          key = os.environ.get('AUR_SSH_PRIVATE_KEY', '')
          if not key:
              raise SystemExit('Register the dedicated AUR public key and configure release/AUR_SSH_PRIVATE_KEY first.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zerus-aur-key'
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as stream:
              stream.write(key.rstrip() + '\n')
          PY
      - name: Prepare dedicated Homebrew tap identity
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          # Arch-only candidates do not need the key; the publisher requires it for a macOS candidate.
          key = os.environ.get('HOMEBREW_TAP_DEPLOY_KEY', '')
          if key:
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zerus-tap-key'
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, 'w') as stream:
                  stream.write(key.rstrip() + '\n')
          PY
      - name: Publish immutable assets and synchronize AUR and Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tap=()
          if [ -f "$RUNNER_TEMP/zerus-tap-key" ]; then tap=(--tap-ssh-key "$RUNNER_TEMP/zerus-tap-key"); fi
          python3 scripts/publish-release.py --candidate dist --version "$RELEASE_VERSION" \
            --ssh-key "$RUNNER_TEMP/zerus-aur-key" "${tap[@]}"
      - name: Remove temporary identities
        if: always()
        run: rm -f "$RUNNER_TEMP/zerus-aur-key" "$RUNNER_TEMP/zerus-tap-key"
