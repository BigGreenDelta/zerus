name: Dev candidates

on:
  workflow_call:
    inputs:
      macos:
        description: Include the signed and installation-verified macOS candidate
        type: boolean
        default: false

permissions:
  contents: read

cache-mode: none

jobs:
  desktop:
    if: >-
      !cancelled() && github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-x86_64-${{ github.sha }}
          path: artifacts/dev-package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.macos
        with:
          name: macos-signed-${{ github.sha }}
          path: artifacts/dev-macos
      - name: Seal the exact verified package and source
        env:
          DEV_RUN_ID: ${{ github.run_id }}
          DEV_RUN_NUMBER: ${{ github.run_number }}
          DEV_COMMIT: ${{ github.sha }}
          MACOS: ${{ inputs.macos }}
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, shutil, subprocess
          root = pathlib.Path('artifacts/dev-input')
          root.mkdir()
          packages = list(pathlib.Path('artifacts/dev-package').glob('*.pkg.tar.zst'))
          if len(packages) != 1:
              raise SystemExit('Expected one checked Arch package.')
          shutil.copyfile(packages[0], root / packages[0].name)
          shutil.copyfile('VERSION', root / 'VERSION')
          shutil.copyfile('DEV_VERSION', root / 'DEV_VERSION')
          shutil.copyfile('artifacts/dev-package/desktop-build-info.json', root / 'desktop-build-info.json')
          subprocess.run(['git', 'archive', '--format=tar.gz', '--prefix=zerus/',
                          '--output=' + str(root / 'zerus-source.tar.gz'), os.environ['DEV_COMMIT']], check=True)
          macos = ['--macos', 'artifacts/dev-macos'] if os.environ['MACOS'] == 'true' else []
          subprocess.run(['python3', 'scripts/prepare-dev-update.py', '--input', str(root),
                          '--output', 'artifacts/dev-desktop', '--platform', 'desktop',
                          '--run-id', os.environ['DEV_RUN_ID'], '--run-number', os.environ['DEV_RUN_NUMBER'],
                          '--source-commit', os.environ['DEV_COMMIT'],
                          '--published-at', datetime.datetime.now(datetime.timezone.utc).isoformat(), *macos], check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerus-dev-desktop-a${{ github.run_attempt }}
          path: artifacts/dev-desktop
          retention-days: 3
          if-no-files-found: error

  # The caller requires the uploaded Android candidate (dev-android.yml).
  channel:
    needs: [desktop]
    if: >-
      !cancelled() && needs.desktop.result == 'success' &&
      github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    concurrency:
      group: dev-channel-tag
      cancel-in-progress: false
    steps:
      - name: Advance only the dev channel tag, preserving newer completed builds
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          prefix = 'repos/ufna/zerus/'
          def api(path, *args):
              result = subprocess.run(['gh', 'api', prefix+path, *args], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit('Dev tag API request failed; no retry or forced move attempted.')
              return json.loads(result.stdout)
          # A successful complete list distinguishes absence from denied/failed lookup.
          refs = api('git/matching-refs/tags/dev')
          current = [r for r in refs if r['ref'] == 'refs/tags/dev']
          if len(current) > 1:
              raise SystemExit('Ambiguous dev tag.')
          commit = os.environ['DEV_COMMIT']
          if not current:
              api('git/refs', '--method', 'POST', '-f', 'ref=refs/tags/dev', '-f', 'sha='+commit)
          else:
              obj = current[0]['object']
              if obj['type'] != 'commit':
                  raise SystemExit('The dev channel must use a lightweight commit tag.')
              if obj['sha'] != commit:
                  comparison = api('compare/'+obj['sha']+'...'+commit)['status']
                  if comparison == 'ahead':
                      api('git/refs/tags/dev', '--method', 'PATCH', '-f', 'sha='+commit, '-F', 'force=false')
                  elif comparison != 'behind':
                      raise SystemExit('Diverged dev source history; channel unchanged.')
          PY
