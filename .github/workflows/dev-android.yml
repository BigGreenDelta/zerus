name: Dev Android candidate

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_GOOGLE_SERVICES_JSON:
        required: true

permissions:
  contents: read

cache-mode: none

jobs:
  # The trusted caller starts this short signed build only after its CI gate.
  android:
    if: >-
      !cancelled() && github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare existing Android identity and private Firebase configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          names = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS',
                   'ANDROID_KEY_PASSWORD', 'ANDROID_GOOGLE_SERVICES_JSON')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Provision the existing Android signer and Firebase configuration in release.')
          private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zerus-dev-signing'
          private.mkdir(mode=0o700)
          def write(path, data):
              with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as stream:
                  stream.write(data)
          write(private / 'signer.jks', base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          def escape(value):
              encoded = value.encode('utf-16-be')
              return ''.join('\\u%04x' % int.from_bytes(encoded[i:i+2], 'big') for i in range(0, len(encoded), 2))
          values = {'storeFile': str(private / 'signer.jks'), 'storePassword': os.environ['ANDROID_STORE_PASSWORD'],
                    'keyAlias': os.environ['ANDROID_KEY_ALIAS'], 'keyPassword': os.environ['ANDROID_KEY_PASSWORD']}
          write(private / 'signing.properties', ''.join(k+'='+escape(v)+'\n' for k,v in values.items()).encode())
          config = json.loads(os.environ['ANDROID_GOOGLE_SERVICES_JSON'])
          write(pathlib.Path('mobile/android/app/google-services.json'), json.dumps(config).encode())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ZERUS_ANDROID_SIGNING_PROPERTIES=' + str(private / 'signing.properties') + '\n')
              output.write('JAVA_HOME=' + os.environ['JAVA_HOME_17_X64'] + '\n')
          PY
      - name: Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build the dev APK with the shared signer
        working-directory: mobile/android
        timeout-minutes: 30
        env:
          DEV_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version_code="$(python3 ../../scripts/android_version_code.py --dev-build-number "$DEV_RUN_NUMBER")"
          ./gradlew --no-daemon assembleRelease \
            -PzerusFirebase=true -PzerusVersionCode="$version_code" \
            -PzerusDevBuildNumber="$DEV_RUN_NUMBER"
      - name: Seal the signed APK and exact source
        env:
          DEV_RUN_ID: ${{ github.run_id }}
          DEV_RUN_NUMBER: ${{ github.run_number }}
          DEV_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, shutil, subprocess
          root = pathlib.Path('artifacts/dev-android-input')
          root.mkdir(parents=True)
          shutil.copyfile('mobile/android/app/build/outputs/apk/release/app-release.apk', root / 'zerus.apk')
          subprocess.run(['git', 'archive', '--format=tar.gz', '--prefix=zerus/',
                          '--output=' + str(root / 'zerus-source.tar.gz'), os.environ['DEV_COMMIT']], check=True)
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          subprocess.run(['python3', 'scripts/prepare-dev-update.py', '--input', str(root),
                          '--output', 'artifacts/dev-android', '--platform', 'android',
                          '--run-id', os.environ['DEV_RUN_ID'], '--run-number', os.environ['DEV_RUN_NUMBER'],
                          '--source-commit', os.environ['DEV_COMMIT'], '--aapt2', str(tools / 'aapt2'),
                          '--apksigner', str(tools / 'apksigner'),
                          '--published-at', datetime.datetime.now(datetime.timezone.utc).isoformat()], check=True)
          PY
      # Also runs after a failed step, so no private input outlives the build.
      - name: Remove private signing inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/zerus-dev-signing" mobile/android/app/build
          rm -f mobile/android/app/google-services.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerus-dev-android-a${{ github.run_attempt }}
          path: artifacts/dev-android
          retention-days: 3
          if-no-files-found: error
