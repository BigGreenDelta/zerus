version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directories: ["/", "/services/mobile/relay", "/services/mobile/connector", "/crates/replica", "/crates/replica-ffi"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    # Keep routine proposals inside the reviewed Cargo.toml constraints,
    # including compatible 0.x releases. Review manifest migrations separately.
    versioning-strategy: lockfile-only
    groups:
      rust:
        applies-to: version-updates
        patterns: ["*"]
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
