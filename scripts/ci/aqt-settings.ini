# aqtinstall settings for the Windows CI Qt installation, read on top of the
# defaults that aqtinstall 3.3.0 ships (`aqt -c scripts/ci/aqt-settings.ini`).
#
# One worker downloads and extracts the Qt archives in turn. With several, one
# archive can create a directory that another is checking: py7zr 1.1.3 resolves
# each member path with Path.resolve(), and on Windows CPython keeps the \\?\
# prefix when a missing parent directory appears between its lookups. The
# containment check then rejects a valid member ("Specified path is bad").
[aqt]
concurrency : 1
